<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="React Native In-App Update">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#e3f3ea"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a5b"/>
      <stop offset="1" stop-color="#26a36c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2421" flood-opacity="0.16"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="180" fill="#1f8a5b" opacity="0.06"/>
  <circle cx="880" cy="430" r="140" fill="#1f8a5b" opacity="0.05"/>

  <!-- Left: text -->
  <g class="sans">
    <rect x="80" y="86" width="184" height="34" rx="17" fill="#e3f3ea" stroke="#1f8a5b" stroke-opacity="0.25"/>
    <circle cx="100" cy="103" r="5" fill="#1f8a5b"/>
    <text x="114" y="109" font-size="15" font-weight="600" fill="#17694a">Android · iOS · Web</text>

    <text x="78" y="186" font-size="54" font-weight="800" fill="#1f2421" letter-spacing="-1.5">React Native</text>
    <text x="78" y="248" font-size="54" font-weight="800" fill="#1f8a5b" letter-spacing="-1.5">In-App Update</text>

    <text x="80" y="298" font-size="21" fill="#5f6762">Keep every user on the latest version of your app</text>
    <text x="80" y="326" font-size="21" fill="#5f6762">with a single hook.</text>
  </g>
  <g class="mono">
    <rect x="80" y="350" width="208" height="38" rx="10" fill="#1d2320"/>
    
    <text x="100" y="375" font-size="16" fill="#8fd3b0">useInAppUpdate</text>
    <text x="235" y="375" font-size="16" fill="#e4e8e5">();</text>
  </g>

  <!-- Right: phone -->
  <g filter="url(#shadow)">
    <rect x="880" y="44" width="236" height="460" rx="38" fill="#1d2320"/>
  </g>
  <rect x="892" y="56" width="212" height="436" rx="28" fill="#ffffff"/>
  <rect x="960" y="68" width="76" height="18" rx="9" fill="#1d2320"/>

  <!-- update card -->
  <g class="sans">
    <circle cx="998" cy="160" r="38" fill="#e3f3ea"/>
    <path d="M998 140 L998 178 M982 156 L998 140 L1014 156" stroke="#1f8a5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="998" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2421">Update available</text>
    <text x="998" y="258" text-anchor="middle" font-size="13" fill="#5f6762">Version 2.1.0 is ready</text>

    <rect x="920" y="284" width="156" height="8" rx="4" fill="#e6e2da"/>
    <rect x="920" y="284" width="112" height="8" rx="4" fill="#1f8a5b"/>
    <text x="920" y="312" font-size="11" fill="#5f6762">Downloading…</text>
    <text x="1076" y="312" text-anchor="end" font-size="11" font-weight="600" fill="#17694a">72%</text>

    <rect x="920" y="336" width="156" height="42" rx="21" fill="url(#btn)"/>
    <text x="998" y="363" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Update now</text>
  </g>
</svg>
